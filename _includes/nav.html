<nav class="nav">
  <a class="nav__brand" href="/">{{ site.title | escape }}</a>

  <div class="nav__links" id="nav-links">
    {% for path in site.header_pages %}
      {% assign p = site.pages | where: 'path', path | first %}
      {% if p %}
        <a href="{{ p.url | default: '/' }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.nav_title | default: p.title | escape }}</a>
      {% endif %}
    {% endfor %}
  </div>

  <div class="dropdown">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="1.8"/></svg>
      <input type="search" id="search-input" placeholder="ara" aria-label="Site içinde ara" autocomplete="off" spellcheck="false">
    </div>
    <div class="dropdown__menu" id="search-results" role="listbox" aria-label="Arama sonuçları"></div>
  </div>

  <button class="nav__theme" id="theme-toggle" type="button" aria-label="Tema değiştir" title="Tema değiştir"></button>

  <button class="nav__toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menüyü aç / kapat">
    <span class="nav__toggle-bar"></span>
    <span class="nav__toggle-bar"></span>
    <span class="nav__toggle-bar"></span>
  </button>
</nav>
