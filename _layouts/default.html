<!DOCTYPE html>
<html lang="{{ page.lang | default: 'tr' }}" data-accent="teal" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/js/theme-init.js?v={{ site.asset_version }}"></script>
  {% seo %}
  <link rel="icon" href="/favicon.ico">
  <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title | escape }}">
  {% if page.alternates %}
  {% for alt in page.alternates %}<link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url | absolute_url }}">
  {% endfor %}<link rel="alternate" hreflang="x-default" href="{{ page.alternates.first.url | absolute_url }}">
  {% endif %}
  <link rel="stylesheet" href="/assets/css/fonts.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/tokens.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/components.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/prose.css?v={{ site.asset_version }}">
</head>
<body>
  <script type="application/json" id="na-topics-data">{{ site.data.topics | jsonify }}</script>
  <a href="#main">İçeriğe geç</a>
  {% include nav.html %}
  <main id="main" class="page" aria-label="İçerik">
    {{ content }}
  </main>
  {% include footer.html %}
  <div class="modal" id="lightbox" hidden>
    <button class="modal__backdrop-close" type="button" aria-label="Kapat" tabindex="-1"></button>
    <div class="modal__card">
      <img src="" alt="" id="lightbox__img">
      <div class="form__actions">
        <button class="btn btn--sm" id="lightbox__prev" type="button" tabindex="-1">‹ önceki</button>
        <button class="btn btn--sm" id="lightbox__next" type="button" tabindex="-1">sonraki ›</button>
      </div>
    </div>
  </div>
  <script src="/assets/js/main.js?v={{ site.asset_version }}" defer></script>
</body>
</html>
