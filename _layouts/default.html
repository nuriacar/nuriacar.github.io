<!DOCTYPE html>
<html lang="tr" data-accent="teal" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/js/theme-init.js?v={{ site.asset_version }}"></script>
  {% seo %}
  <link rel="icon" href="/favicon.ico">
  <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title | escape }}">
  <link rel="stylesheet" href="/assets/css/tokens.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/accent/teal.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/mode/dark.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/mode/light.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/base.css?v={{ site.asset_version }}">
  <link rel="stylesheet" href="/assets/css/nav.css?v={{ site.asset_version }}">
</head>
<body>
  <script type="application/json" id="na-topics-data">{{ site.data.topics | jsonify }}</script>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  {% include nav.html %}
  <main id="main" class="page" aria-label="İçerik">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="/assets/js/main.js?v={{ site.asset_version }}" defer></script>
</body>
</html>
