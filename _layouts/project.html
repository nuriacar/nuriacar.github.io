---
layout: default
---
<nav class="breadcrumb" aria-label="Yol">
  <a href="/">{{ site.title | escape }}</a>
  <span class="breadcrumb__sep">›</span>
  {% if page.breadcrumb_parent %}
  <a href="{{ page.breadcrumb_parent_url }}">{{ page.breadcrumb_parent }}</a>
  <span class="breadcrumb__sep">›</span>
  {% endif %}
  <span>{{ page.nav_title | default: page.title | escape }}</span>
</nav>

{{ content }}
